{% extends "base.html" %}
{% block title %}Manager Dashboard{% endblock %}
{% block content %}
<h1>Manager Dashboard</h1>
<div class="cards">
  <article><span>Time entries waiting</span><strong>{{ counts.time }}</strong></article>
  <article><span>Leave requests waiting</span><strong>{{ counts.leave }}</strong></article>
  <article><span>Active employees</span><strong>{{ counts.employees }}</strong></article>
</div>
<div class="actions">
  <a class="button" href="{{ url_for('manager.review_time') }}">Review Time</a>
  <a class="button secondary" href="{{ url_for('manager.review_time_off') }}">Review Time Off</a>
  <a class="button secondary" href="{{ url_for('payroll.dashboard') }}">Open Payroll</a>
</div>
{% endblock %}
